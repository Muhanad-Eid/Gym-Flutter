name: gym
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.3
  intl: ^0.20.2
  fl_chart: ^1.1.1
  cached_network_image: ^3.4.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/App_Icon.jpeg"
  image_path: "assets/App_Icon.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/App_Icon.jpeg
